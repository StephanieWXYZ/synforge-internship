version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - env | grep -e DYNAMODB_TABLE_NAME -e RUNTIME_SECRET_NAME -e UPLOAD_BUCKET_NAME >> .env.production
        - npm run prisma:generate
    build:
      commands:
        - npm run build
        - npm run verify:deployment
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
