name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multi-persona-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test application and infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Test and build application
        env:
          DATABASE_URL: file:./ci.db
          LLM_API_KEY: ci-placeholder
        run: |
          npm ci
          npm run prisma:generate
          npm run test
          npm run lint
          npm run build

      - name: Test infrastructure
        run: |
          npm ci --prefix infra
          npm run typecheck --prefix infra
          npm run test --prefix infra
